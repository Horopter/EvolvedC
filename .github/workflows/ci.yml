name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang clang-format

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install llvm clang-format || true
          echo "LLVM bin: $(brew --prefix llvm)/bin"
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Show tool versions
        run: |
          cc --version || clang --version
          clang-format --version || true

      - name: Apply formatting (non-blocking)
        run: |
          clang-format --version || exit 0
          find src test -type f \( -name "*.c" -o -name "*.h" \) -exec clang-format -i {} + || true

      - name: Run test suites
        shell: bash
        run: |
          echo "Initial pwd:"; pwd
          echo "List root:"; ls -la
          # Determine test directory
          TEST_DIR=""
          if [ -d "EvolvedC/test" ]; then TEST_DIR="EvolvedC/test"; elif [ -d "test" ]; then TEST_DIR="test"; fi
          if [ -z "$TEST_DIR" ]; then echo "test directory not found"; exit 1; fi
          echo "Using TEST_DIR=$TEST_DIR"
          cd "$TEST_DIR"
          echo "pwd in test dir:"; pwd
          ls -la
          chmod +x run_tests.sh
          ./run_tests.sh .
          ./run_tests.sh vector
          ./run_tests.sh array
          ./run_tests.sh buffer
          ./run_tests.sh deque
